[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fortran-analyser"
version = "0.2.0"
description = "Static Fortran source analysis with structured, explainable results"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["fparser==0.2.5"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
fortran-analyser = "fortran_analyser.cli:main"
fortran-analyser-web = "fortran_analyser.web:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/fortran_analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
